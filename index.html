<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="International Islamic University Chittagong (IIUC) Official Student Portal Login.">
  <title>Student Login | International Islamic University Chittagong</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- IIUC Fullscreen Ocean Blue Auth Container -->
  <main class="iiuc-auth-wrapper">
    <div class="iiuc-login-card">
      
      <!-- Card Header: IIUC Crest Logo & Title -->
      <div class="iiuc-login-header">
        <img src="assets/images/logo.png" alt="IIUC Crest Logo" class="iiuc-login-logo">
        <h1 class="iiuc-login-title">International Islamic University Chittagong</h1>
      </div>

      <!-- Multi-color Accent Rainbow Stripe Bar -->
      <div class="rainbow-accent-bar" role="presentation"></div>

      <!-- Login Form -->
      <form action="dashboard.html" method="GET" aria-label="IIUC Student Login Form">
        <div class="iiuc-form-group">
          <label for="student-id" class="sr-only" style="display:none;">Student ID</label>
          <input 
            type="text" 
            id="student-id" 
            name="student_id" 
            class="iiuc-input" 
            value="C243237" 
            placeholder="C243237" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="iiuc-form-group">
          <label for="password" class="sr-only" style="display:none;">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="iiuc-input" 
            value="••••••••" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="iiuc-login-btn">Login</button>

        <!-- Card Footer Info -->
        <footer class="iiuc-auth-footer">
          <p style="margin-bottom: 0.35rem;">
            Copyright &copy; 2026 All rights reserved IIUC and <span style="color: #ff9800; font-weight: 700;">Developed by</span>
          </p>
          <p style="margin-bottom: 0.35rem;">
            <a href="#" onclick="alert('Password reset link sent to your registered IIUC email.'); return false;">Forget Password</a> Only for Students &bull; <a href="signup.html">Sign Up</a>
          </p>
          <div class="ip-info-text">
            <p>IP: 103.133.205.10, Country: Bangladesh, City: Dhaka</p>
            <p style="font-size: 0.7rem; color: #888888; margin-top: 0.15rem;">(We will store your information)</p>
          </div>
        </footer>
      </form>

    </div>
  </main>

</body>
</html>
