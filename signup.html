<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="International Islamic University Chittagong (IIUC) Student Registration.">
  <title>Student Registration | IIUC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- IIUC Fullscreen Ocean Blue Auth Container -->
  <main class="iiuc-auth-wrapper">
    <div class="iiuc-login-card iiuc-login-card-wide">
      
      <!-- Card Header -->
      <div class="iiuc-login-header">
        <img src="assets/images/logo.png" alt="IIUC Crest Logo" class="iiuc-login-logo">
        <h1 class="iiuc-login-title">International Islamic University Chittagong</h1>
      </div>

      <!-- Multi-color Accent Rainbow Stripe Bar -->
      <div class="rainbow-accent-bar" role="presentation"></div>

      <!-- Registration Form -->
      <form action="index.html" method="GET" aria-label="IIUC Student Registration Form">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 0.85rem;">
          <div>
            <label for="student-id" style="font-size: 0.8rem; font-weight: 600; color: #444;">Matric / Student ID *</label>
            <input type="text" id="student-id" name="student_id" class="iiuc-input" placeholder="C243237" required>
          </div>
          <div>
            <label for="email" style="font-size: 0.8rem; font-weight: 600; color: #444;">Email Address *</label>
            <input type="email" id="email" name="email" class="iiuc-input" placeholder="ridwanulk08@gmail.com" required autocomplete="email">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 1.25rem;">
          <div>
            <label for="password" style="font-size: 0.8rem; font-weight: 600; color: #444;">Password *</label>
            <input type="password" id="password" name="password" class="iiuc-input" placeholder="••••••••" required autocomplete="new-password">
          </div>
          <div>
            <label for="confirm-password" style="font-size: 0.8rem; font-weight: 600; color: #444;">Confirm Password *</label>
            <input type="password" id="confirm-password" name="confirm_password" class="iiuc-input" placeholder="••••••••" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="iiuc-login-btn">Register Account</button>

        <!-- Card Footer Info -->
        <footer class="iiuc-auth-footer">
          <p style="margin-bottom: 0.35rem;">
            Copyright &copy; 2026 All rights reserved IIUC and <span style="color: #ff9800; font-weight: 700;">Developed by</span>
          </p>
          <p>
            Already have an account? <a href="index.html">Click here to Login</a>
          </p>
        </footer>
      </form>

    </div>
  </main>

</body>
</html>
